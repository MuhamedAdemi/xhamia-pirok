      <a href="{{ portali.adresa }}" style="color:#2D5A1B;">{{ portali.adresa }}</a><br>

      <span style="font-size:12px; color:#6E6E73;">Fjalëkalimin mund ta ndryshoni pasi të hyni, te "Ndrysho Fjalëkalimin".</span>{% endif %}
